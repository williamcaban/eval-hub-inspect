[project]
name = "eval-hub-inspect"
version = "0.1.0"
description = "inspect_ai task implementations for AI evaluation benchmarks — runnable standalone and EvalHub-compatible via the Inspect adapter"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.260",
    "huggingface-hub>=0.24.0",
    "jsonlines>=4.0.0",
    "openai>=3.3.1",
]

[project.optional-dependencies]
agenticdatabench = [
    "pandas>=2.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "fuzzywuzzy>=0.18.0",
    "python-Levenshtein>=0.25.0",
    "scipy>=1.12.0",
    "Pillow>=12.3.0",
    "statsmodels>=0.14.0",
    "joblib>=1.3.0",
    "opencv-python-headless>=4.8.1.78",
    "matplotlib>=3.8.0",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticdatabench", "src/agentjudgebench"]

# ── Ruff ──────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes (unused imports, undefined names)
    "I",    # isort
    "B",    # flake8-bugbear (likely bugs and design issues)
    "S",    # flake8-bandit (security — maps to bandit rules)
    "UP",   # pyupgrade (enforce modern Python syntax)
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "T20",  # flake8-print (catch accidental debug prints)
    "RUF",  # ruff-specific rules
]
ignore = [
    "S101",   # assert — fine in tests and inspect_ai task definitions
    "T201",   # print() — acceptable in CLI scripts (check_dep_cves.py)
    # S307 (eval) is intentionally NOT ignored globally.
    # The scorer uses eval() on trusted, statically-defined strings from the
    # benchmark dataset (not user input). Each call site carries # noqa: S307
    # with an inline explanation so it stays visible during review.
]

[tool.ruff.lint.per-file-ignores]
"tests/**"    = ["S101"]           # assert is idiomatic in pytest
"scripts/**"  = ["T201", "S603"]   # print() and subprocess OK in dev scripts

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

# ── Mypy ──────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
# inspect_ai ships type stubs; third-party data-science libs may not
ignore_missing_imports = true

[[tool.mypy.overrides]]
# metrics/ is ported from DA-Code (MIT) — third-party code with relaxed typing
module = ["agenticdatabench.metrics.*"]
ignore_errors = true

# ── Bandit ────────────────────────────────────────────────────────────────────
# Bandit is run via ruff-S, but keep a standalone config for CI --bandit step
# so reports surface file:line references in GH Actions annotations.
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]   # assert — same rationale as ruff S101

# ── Pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# ── uv ────────────────────────────────────────────────────────────────────────
[tool.uv]
# Optional groups used during local development but not installed in published wheels.
# uv sync --extra dev  →  installs ruff, mypy, bandit, pytest
default-groups = []

[dependency-groups]
# uv-native dev group (separate from PEP 508 optional-dependencies)
# Run: uv sync --group dev
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.16.4",
    "mypy>=2.3.1",
    "bandit>=1.9.4",
]
